apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservicios
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/erickperez091/k8s-microservices-springboot.git
    targetRevision: main
    path: Deployment/kubernetes/common
  destination:
    server: https://kubernetes.default.svc
    namespace: springboot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true